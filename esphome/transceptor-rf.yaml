# Transceptor RF — CC1101 + ESP32 (DOIT DevKit V1) — modo dual-pin
#
# Cableado:
#   GND→GND  3.3V→VCC  GPIO5→CSN (pin 4)
#   GPIO18→SCK  GPIO23→MOSI  GPIO19→MISO
#   GPIO4→GDO0 (pin 3) TX    GPIO2→GDO2 (pin 8) RX
#
# TX: transmit_raw desde captura Flipper BinRAW (152bit, TE=356µs)

esphome:
  name: transceptor-rf
  friendly_name: Transceptor RF
  min_version: 2026.7.4

esp32:
  variant: esp32
  flash_size: 4MB
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

logger:
  level: INFO

api:
  encryption:
    key: "sahxzY0ZjIcBv3mBvxkW6bO6DuJCmWSAijzVAODTkcA="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Transceptor RF Fallback Hotspot
    password: "0SngoGnyZvxS"

captive_portal:

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

cc1101:
  id: rf_radio
  cs_pin: GPIO5
  frequency: 433.88MHz
  modulation_type: ASK/OOK
  symbol_rate: 5000
  filter_bandwidth: 203kHz
  output_power: 10

remote_receiver:
  pin: GPIO2
  dump:
    - raw
    - rc_switch
  tolerance: 25%
  idle: 4ms
  filter: 250us
  buffer_size: 8kb
  rmt_symbols: 256
  receive_symbols: 256
  filter_symbols: 48

remote_transmitter:
  id: rf_tx
  pin:
    number: GPIO4
    allow_other_uses: true
  carrier_duty_percent: 100%
  rmt_symbols: 256
  on_transmit:
    then:
      - cc1101.set_idle:
          id: rf_radio
      - delay: 2ms
      - cc1101.begin_tx:
          id: rf_radio
  on_complete:
    then:
      - cc1101.set_idle:
          id: rf_radio
      - delay: 2ms
      - cc1101.begin_rx:
          id: rf_radio

script:
  - id: tx_luz_encendida
    then:
      - remote_transmitter.transmit_raw:
          transmitter_id: rf_tx
          code: !include code_fan_light_on.yaml
          repeat:
            times: 8
            wait_time: 50ms

  - id: tx_luz_apagada
    then:
      - remote_transmitter.transmit_raw:
          transmitter_id: rf_tx
          code: !include code_fan_light_off.yaml
          repeat:
            times: 8
            wait_time: 50ms

button:
  - platform: template
    name: "Luz encendida"
    icon: mdi:lightbulb-on
    on_press:
      - script.execute: tx_luz_encendida

  - platform: template
    name: "Luz apagada"
    icon: mdi:lightbulb-off
    on_press:
      - script.execute: tx_luz_apagada

  # Prueba hardware: si al pulsar esto el mando físico deja de funcionar ~3s, el CC1101 SÍ emite RF
  - platform: template
    name: "Test TX continuo 3s"
    icon: mdi:antenna
    on_press:
      - cc1101.begin_tx:
          id: rf_radio
      - delay: 3s
      - cc1101.begin_rx:
          id: rf_radio
