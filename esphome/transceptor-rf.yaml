# Transceptor RF — CC1101 + ESP32 (DOIT DevKit V1) — modo dual-pin
#
# Cableado:
#   GND→GND  3.3V→VCC  GPIO5→CSN (pin 4)
#   GPIO18→SCK (pin 5)  GPIO23→MOSI (pin 6)  GPIO19→MISO (pin 7)
#   GPIO4→GDO0 (pin 3)  TX    GPIO2→GDO2 (pin 8)  RX
#
# Cómo usar:
#   1. Instala y abre Logs
#   2. Pulsa un mando → copia la línea "Received RCSwitch Raw: ..."
#   3. Duplica un botón de abajo y pega code + protocol
#
# Referencias:
#   https://github.com/phdindota/cc1101-transceiver
#   https://github.com/Daedilus/cc1101-esp32-esphome-fan-controller
#   https://esphome.io/components/cc1101/

esphome:
  name: transceptor-rf
  friendly_name: Transceptor RF
  min_version: 2026.7.4

esp32:
  variant: esp32
  flash_size: 4MB
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

logger:
  level: INFO

api:
  encryption:
    key: "sahxzY0ZjIcBv3mBvxkW6bO6DuJCmWSAijzVAODTkcA="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Transceptor RF Fallback Hotspot
    password: "0SngoGnyZvxS"

captive_portal:

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

cc1101:
  id: rf_radio
  cs_pin: GPIO5
  frequency: 433.92MHz
  modulation_type: ASK/OOK
  output_power: 10

# Dual-pin (recomendado): GDO0=TX (GPIO4), GDO2=RX (GPIO2)
# RMT del ESP32: 512 símbolos compartidos RX+TX → 256+256
remote_receiver:
  pin: GPIO2
  dump:
    - rc_switch
    # Añade "raw" solo al aprender códigos nuevos (genera mucha carga en logs/API)
  tolerance: 50%
  idle: 2ms
  filter: 100us
  buffer_size: 8kb
  rmt_symbols: 256
  receive_symbols: 256
  filter_symbols: 48

remote_transmitter:
  pin: GPIO4
  carrier_duty_percent: 100%
  rmt_symbols: 256
  on_transmit:
    then:
      - cc1101.begin_tx:
          id: rf_radio
  on_complete:
    then:
      - cc1101.begin_rx:
          id: rf_radio

button:
  # Códigos capturados de tu mando (RC-Switch protocolo 6)
  - platform: template
    name: "Luz intensidad 3"
    icon: mdi:lightbulb-on-80
    on_press:
      - remote_transmitter.transmit_rc_switch_raw:
          code: "01011001011010101011101001111010"
          protocol: 6
          repeat:
            times: 8
            wait_time: 50ms

  - platform: template
    name: "Luz apagada"
    icon: mdi:lightbulb-off
    on_press:
      - remote_transmitter.transmit_rc_switch_raw:
          code: "01100101100101101011101001111010"
          protocol: 6
          repeat:
            times: 8
            wait_time: 50ms

