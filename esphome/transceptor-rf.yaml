# Transceptor RF genérico — CC1101 + ESP32 (cualquier mando 433 MHz)
#
# Pinout CC1101 → ESP32:
#   GND→GND  VCC→3.3V  GDO0→GPIO4  CSN→GPIO5
#   SCK→GPIO18  MOSI→GPIO23  MISO→GPIO19  GDO2→N/C
#
# Uso:
#   1. Pulsa un mando → mira los logs o sensores en HA
#   2. Si aparece RC-Switch: usa transmit_rc_switch_raw (código corto)
#   3. Si solo aparece HEX: usa el script tx_hex o transmit_raw
#   4. Botón "Repetir última señal" reenvía lo capturado sin editar YAML
#
# Proyectos de referencia:
#   https://github.com/phdindota/cc1101-transceiver
#   https://github.com/sha1cybr/esp32-cc1101-rf-caprep

esphome:
  name: transceptor-rf
  friendly_name: Transceptor RF
  min_version: 2026.7.4

esp32:
  variant: esp32
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: "sahxzY0ZjIcBv3mBvxkW6bO6DuJCmWSAijzVAODTkcA="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Transceptor RF Fallback Hotspot
    password: "0SngoGnyZvxS"

captive_portal:

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

cc1101:
  id: rf_radio
  cs_pin: GPIO5
  frequency: 433.92MHz
  modulation_type: ASK/OOK
  symbol_rate: 5000
  filter_bandwidth: 250kHz
  output_power: 10

globals:
  - id: g_rf_hex
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: g_rf_bits
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_rc_code
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: g_rc_protocol
    type: int
    restore_value: no
    initial_value: '0'

remote_receiver:
  id: rf_rx
  pin:
    number: GPIO4
    mode:
      input: true
      output: true
      pullup: true
      open_drain: true
    allow_other_uses: true
  dump:
    - raw
    - rc_switch
  tolerance: 50%
  idle: 4ms
  filter: 250us
  buffer_size: 4kb
  on_raw:
    then:
      - lambda: |-
          const int THRESH = 700;
          std::string bits;
          bits.reserve(x.size());
          for (int v : x) {
            bits += (abs(v) > THRESH) ? '1' : '0';
          }
          const int bit_count = bits.size();
          std::string hex;
          std::string padded = bits;
          const int pad = (8 - padded.size() % 8) % 8;
          padded.append(pad, '0');
          for (size_t i = 0; i < padded.size(); i += 8) {
            uint8_t byte = 0;
            for (int j = 0; j < 8; j++) {
              byte = (byte << 1) | (padded[i + j] == '1' ? 1 : 0);
            }
            char buf[3];
            snprintf(buf, sizeof(buf), "%02X", byte);
            hex += buf;
          }
          id(g_rf_hex) = hex;
          id(g_rf_bits) = bit_count;
          id(txt_rf_hex).publish_state(hex + " (" + std::to_string(bit_count) + "b)");
          ESP_LOGI("rf", "HEX=%s BITS=%d PULSOS=%d", hex.c_str(), bit_count, (int) x.size());
          ESP_LOGI("rf", "Para boton HEX: script tx_hex con hex=%s bits=%d", hex.c_str(), bit_count);
  on_rc_switch:
    then:
      - lambda: |-
          std::string bits;
          for (int i = 63; i >= 0; i--) {
            bits += ((x.code >> i) & 1) ? '1' : '0';
          }
          const size_t start = bits.find('1');
          if (start != std::string::npos) {
            bits = bits.substr(start);
          }
          id(g_rc_code) = bits;
          id(g_rc_protocol) = x.protocol;
          id(txt_rc_switch).publish_state(
            "proto=" + std::to_string(x.protocol) + " data=" + bits);
          ESP_LOGI("rf", "RC-SWITCH proto=%d data=%s code=0x%llX",
                   x.protocol, bits.c_str(), (unsigned long long) x.code);

remote_transmitter:
  id: rf_tx
  pin:
    number: GPIO4
    mode:
      input: true
      output: true
      pullup: true
      open_drain: true
    allow_other_uses: true
  carrier_duty_percent: 100%
  non_blocking: true
  rmt_symbols: 256
  on_transmit:
    then:
      - cc1101.set_idle:
          id: rf_radio
      - remote_transmitter.digital_write: false
      - cc1101.begin_tx:
          id: rf_radio
  on_complete:
    then:
      - cc1101.set_idle:
          id: rf_radio
      - remote_transmitter.digital_write: true
      - cc1101.begin_rx:
          id: rf_radio

text_sensor:
  - platform: template
    name: "RF último HEX"
    id: txt_rf_hex
    icon: mdi:hexadecimal
    lambda: |-
      if (id(g_rf_hex).empty()) return std::string("-");
      return id(g_rf_hex) + " (" + std::to_string(id(g_rf_bits)) + "b)";
    update_interval: 2s

  - platform: template
    name: "RF último RC-Switch"
    id: txt_rc_switch
    icon: mdi:radio-tower
    lambda: |-
      if (id(g_rc_code).empty()) return std::string("-");
      return "proto=" + std::to_string(id(g_rc_protocol)) + " " + id(g_rc_code);
    update_interval: 2s

script:
  - id: tx_hex
    parameters:
      hex_code: string
      bit_count: int
      repeat_count: int
    then:
      - lambda: |-
          const int SHORT = 345;
          const int LONG = 1045;
          std::string bits;
          for (size_t i = 0; i + 1 < hex_code.length(); i += 2) {
            uint8_t byte = 0;
            for (int n = 0; n < 2; n++) {
              char c = hex_code[i + n];
              int nibble = -1;
              if (c >= '0' && c <= '9') nibble = c - '0';
              else if (c >= 'A' && c <= 'F') nibble = c - 'A' + 10;
              else if (c >= 'a' && c <= 'f') nibble = c - 'a' + 10;
              if (nibble >= 0) byte = (byte << 4) | nibble;
            }
            for (int b = 7; b >= 0; b--) bits += ((byte >> b) & 1) ? '1' : '0';
          }
          if (bit_count > 0 && (size_t) bit_count < bits.size()) {
            bits.resize(bit_count);
          }
          std::vector<int32_t> code;
          code.reserve(bits.size());
          for (size_t i = 0; i < bits.size(); i++) {
            int mag = (bits[i] == '1') ? LONG : SHORT;
            code.push_back((i % 2 == 0) ? mag : -mag);
          }
          const int reps = repeat_count > 0 ? repeat_count : 3;
          auto call = id(rf_tx).transmit();
          call.get_data()->set_data(code);
          call.set_send_times(reps);
          call.set_send_wait(50000);
          call.perform();

  - id: tx_last_hex
    then:
      - script.execute:
          id: tx_hex
          hex_code: !lambda 'return id(g_rf_hex);'
          bit_count: !lambda 'return id(g_rf_bits);'
          repeat_count: 8

  - id: tx_last_rc_switch
    then:
      - if:
          condition:
            lambda: 'return !id(g_rc_code).empty();'
          then:
            - lambda: |-
                uint8_t proto = id(g_rc_protocol);
                if (proto > 8) proto = 1;
                const std::string bits = id(g_rc_code);
                const uint64_t code = esphome::remote_base::decode_binary_string(bits);
                const uint8_t nbits = bits.size();
                auto call = id(rf_tx).transmit();
                esphome::remote_base::RC_SWITCH_PROTOCOLS[proto].transmit(call.get_data(), code, nbits);
                call.set_send_times(10);
                call.set_send_wait(10000);
                call.perform();

button:
  - platform: template
    name: "RF Repetir última (HEX)"
    icon: mdi:replay
    on_press:
      - script.execute: tx_last_hex

  - platform: template
    name: "RF Repetir última (RC-Switch)"
    icon: mdi:replay-circle
    on_press:
      - script.execute: tx_last_rc_switch

  - platform: template
    name: "RF Limpiar memoria"
    icon: mdi:delete
    on_press:
      - lambda: |-
          id(g_rf_hex) = "";
          id(g_rf_bits) = 0;
          id(g_rc_code) = "";
          id(g_rc_protocol) = 0;
          id(txt_rf_hex).publish_state("-");
          id(txt_rc_switch).publish_state("-");

