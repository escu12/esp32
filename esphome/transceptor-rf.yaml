# Transceptor RF — CC1101 + ESP32 — dual-pin (GPIO4=TX, GPIO2=RX)
#
# Añadir dispositivo: copia key + TE desde Flipper BinRAW en substitutions.

substitutions:
  fan_off_key: "0000017117717117717117-1711171771111717"
  fan_off_te: "342"
  fan_on_key: "0000017171177171171717-1711171771111717"
  fan_on_te: "346"

esphome:
  name: transceptor-rf
  friendly_name: Transceptor RF
  min_version: 2026.7.4

esp32:
  variant: esp32
  flash_size: 4MB
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

logger:
  level: INFO

api:
  encryption:
    key: "sahxzY0ZjIcBv3mBvxkW6bO6DuJCmWSAijzVAODTkcA="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Transceptor RF Fallback Hotspot
    password: "0SngoGnyZvxS"

captive_portal:

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

cc1101:
  id: rf_radio
  cs_pin: GPIO5
  frequency: 433.88MHz
  modulation_type: ASK/OOK
  symbol_rate: 5000
  filter_bandwidth: 203kHz
  output_power: 10

remote_receiver:
  pin: GPIO2
  dump:
    - rc_switch
  tolerance: 25%
  idle: 4ms
  filter: 250us
  buffer_size: 8kb
  rmt_symbols: 256
  receive_symbols: 256
  filter_symbols: 48

remote_transmitter:
  id: rf_tx
  pin: GPIO4
  carrier_duty_percent: 100%
  non_blocking: true
  rmt_symbols: 256
  on_transmit:
    then:
      - cc1101.set_idle:
          id: rf_radio
      - delay: 2ms
      - cc1101.begin_tx:
          id: rf_radio
  on_complete:
    then:
      - cc1101.set_idle:
          id: rf_radio
      - delay: 2ms
      - cc1101.begin_rx:
          id: rf_radio

# Decodifica key Flipper BinRAW (hex 0/1/7 → 152 bit → pulsos TE µs)
script:
  - id: flipper_raw_tx
    parameters:
      binraw_key: string
      te_us: int
    then:
      - lambda: !lambda |-
          std::string k;
          k.reserve(binraw_key.size());
          for (char c : binraw_key) {
            if (c != '-') k += c;
          }
          std::string bits;
          bits.reserve(k.size() * 4);
          for (char ch : k) {
            int v = (ch >= '0' && ch <= '9') ? (ch - '0') : (ch - 'A' + 10);
            for (int i = 3; i >= 0; i--) bits += ((v >> i) & 1) ? '1' : '0';
          }
          std::vector<int32_t> pulses;
          if (!bits.empty()) {
            char cur = bits[0];
            int count = 1;
            for (size_t i = 1; i < bits.size(); i++) {
              if (bits[i] == cur) {
                count++;
              } else {
                int dur = count * te_us;
                pulses.push_back(cur == '1' ? dur : -dur);
                cur = bits[i];
                count = 1;
              }
            }
            int dur = count * te_us;
            pulses.push_back(cur == '1' ? dur : -dur);
          }
          auto call = id(rf_tx).transmit();
          esphome::remote_base::RawProtocol().encode(call.get_data(), pulses);
          call.set_send_times(8);
          call.set_send_wait(50000);
          call.perform();

button:
  - platform: template
    name: "Luz encendida"
    icon: mdi:lightbulb-on
    on_press:
      - script.execute:
          id: flipper_raw_tx
          binraw_key: "${fan_on_key}"
          te_us: !lambda "return ${fan_on_te};"

  - platform: template
    name: "Luz apagada"
    icon: mdi:lightbulb-off
    on_press:
      - script.execute:
          id: flipper_raw_tx
          binraw_key: "${fan_off_key}"
          te_us: !lambda "return ${fan_off_te};"

