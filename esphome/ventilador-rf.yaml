# ESPHome 2026.7.4 — CC1101 + ESP32-WROOM-32 como mando RF de ventilador
#
# Pinout CC1101 → ESP32:
#   Pin 1 GND      → GND
#   Pin 2 VCC      → 3.3V  (¡nunca 5V!)
#   Pin 3 GDO0     → GPIO4  (datos TX/RX)
#   Pin 4 CSN      → GPIO5
#   Pin 5 SCK      → GPIO18
#   Pin 6 MOSI     → GPIO23
#   Pin 7 MISO     → GPIO19
#   Pin 8 GDO2     → N/C (modo un solo pin)
#
# FASE 1 — Aprender señales:
#   1. Compila y flashea esta config.
#   2. Abre los logs de ESPHome (nivel DEBUG).
#   3. Pulsa cada botón del mando original del ventilador.
#   4. Copia el array "code: [...]" que aparece en los logs.
#   5. Pégalo en los botones de abajo (sustituye PLACEHOLDER_*).
#
# FASE 2 — Usar botones en Home Assistant:
#   Tras reemplazar los códigos, los botones aparecerán en HA automáticamente.

substitutions:
  device_name: ventilador-rf
  friendly_name: Ventilador RF

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.7.4

esp32:
  board: esp32dev
  framework:
  type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

cc1101:
  id: rf_radio
  cs_pin: GPIO5
  frequency: 433.92MHz
  modulation_type: ASK/OOK
  symbol_rate: 5000
  filter_bandwidth: 250kHz
  output_power: 10

# GDO2 no conectado → un solo pin (GDO0 en GPIO4).
# Open-drain es el método recomendado en ESP32 para TX fiable.
remote_receiver:
  id: rf_rx
  pin:
    number: GPIO4
    mode:
      input: true
      output: true
      pullup: true
      open_drain: true
    allow_other_uses: true
  dump: raw
  tolerance: 50%
  idle: 4ms
  filter: 250us
  buffer_size: 2kb

remote_transmitter:
  id: rf_tx
  pin:
    number: GPIO4
    mode:
      input: true
      output: true
      pullup: true
      open_drain: true
    allow_other_uses: true
  carrier_duty_percent: 100%
  non_blocking: true
  on_transmit:
    then:
      - cc1101.set_idle: rf_radio
      - remote_transmitter.digital_write: false
      - cc1101.begin_tx: rf_radio
  on_complete:
    then:
      - cc1101.set_idle: rf_radio
      - remote_transmitter.digital_write: true
      - cc1101.begin_rx: rf_radio

# Repite la transmisión 3 veces (muchos ventiladores necesitan varios envíos).
script:
  - id: tx_fan_on
    then:
      - remote_transmitter.transmit_raw:
          code: !include code_fan_on.yaml
          repeat:
            times: 3
            wait_time: 15ms

  - id: tx_fan_off
    then:
      - remote_transmitter.transmit_raw:
          code: !include code_fan_off.yaml
          repeat:
            times: 3
            wait_time: 15ms

  - id: tx_fan_speed_1
    then:
      - remote_transmitter.transmit_raw:
          code: !include code_fan_speed_1.yaml
          repeat:
            times: 3
            wait_time: 15ms

  - id: tx_fan_speed_2
    then:
      - remote_transmitter.transmit_raw:
          code: !include code_fan_speed_2.yaml
          repeat:
            times: 3
            wait_time: 15ms

  - id: tx_fan_speed_3
    then:
      - remote_transmitter.transmit_raw:
          code: !include code_fan_speed_3.yaml
          repeat:
            times: 3
            wait_time: 15ms

  - id: tx_fan_light_on
    then:
      - remote_transmitter.transmit_raw:
          code: !include code_fan_light_on.yaml
          repeat:
            times: 3
            wait_time: 15ms

  - id: tx_fan_light_off
    then:
      - remote_transmitter.transmit_raw:
          code: !include code_fan_light_off.yaml
          repeat:
            times: 3
            wait_time: 15ms

button:
  - platform: template
    name: "Ventilador Encender"
    icon: mdi:fan
    on_press:
      - script.execute: tx_fan_on

  - platform: template
    name: "Ventilador Apagar"
    icon: mdi:fan-off
    on_press:
      - script.execute: tx_fan_off

  - platform: template
    name: "Ventilador Velocidad 1"
    icon: mdi:fan-speed-1
    on_press:
      - script.execute: tx_fan_speed_1

  - platform: template
    name: "Ventilador Velocidad 2"
    icon: mdi:fan-speed-2
    on_press:
      - script.execute: tx_fan_speed_2

  - platform: template
    name: "Ventilador Velocidad 3"
    icon: mdi:fan-speed-3
    on_press:
      - script.execute: tx_fan_speed_3

  - platform: template
    name: "Ventilador Luz ON"
    icon: mdi:lightbulb-on
    on_press:
      - script.execute: tx_fan_light_on

  - platform: template
    name: "Ventilador Luz OFF"
    icon: mdi:lightbulb-off
    on_press:
      - script.execute: tx_fan_light_off
